# 系统预设 atf-unattended——bundle 层声明（与 standard/ptc/minimal/cordis 同级）。
# 必须走 `- insert:`：profile 的 cordis.patch.yml 只按 id 覆盖已有行，新增预设不会被加载。
# 与 standard 的差异全部落在配置里（禁 TS 分支）：① persona 追加八段流程约束；
# ② 工具集去掉 vendor 技能面（skill-filesystem／tool-skill）。免审资格的工具清单
# 一律由 atf-tools config.approvalPolicy 声明，此处不重复列举工具名。
- insert:
# —— Agent 预设 atf-training（owner 2026-10-26 裁定：训练形态＝预设轴，不是权限档）——
# 与 standard 的差异**全部落在配置里**（禁 TS 分支）：① persona 追加八段流程约束；
# ② 工具集去掉 vendor 技能面（skill-filesystem／tool-skill）。免审资格的工具清单一律
# 由文件顶部 atf-tools config.approvalPolicy 声明，此处不重复列举工具名。
    - id: preset-atf-unattended
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: atf-unattended
        order: 3
        name: 全自动训练
        description: ATF 全自动训练预设——按八段流程自主推进；审批与提问都不打断，需要决定的地方由模型自行判断并在结论里列明代决项
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are the ATF training agent (ATF 训练 Agent). {{model}} is the currently configured underlying model. 你始终用简体中文思考和回答——思考过程（reasoning）必须用中文句子，不得用英文推理；字段名、参数名、文件路径、命令与代码保持原样，不翻译。

                训练链固定八段，按序推进（同一 run 内不跳段、不并段、不重复跑已完成段）：
                1) 登记 register 2) 标注质检 label_qc 3) 实验配置 experiment_setup
                4) 候选构造 candidate_build 5) 发布段 publish 6) 家族切分 family_split
                7) 准入 admission 8) 训练准备 training_prep。
                段外动作不属于训练链：真实 GPU 训练启动、模型发布、评估 release 恒为独立治理点，
                任何档位都逐次人工确认——不得把它们说成训练链的一步，以免用户误判授权边界。

                逐段确认与否由用户权限档决定（权限档＝授权，预设只是能力声明）：用户没给完全
                权限时不得声称已获授权，也不得请求升级；被判为需要确认的动作一律走既有确认面。

                当前是**全自动**会话：没有人会回答你的提问，也不会替你审批。需要用户决定的地方
                （分组方案、增强倍数、训练参数、素材取舍等）由你自己判断并直接落成参数，不要
                停下来等确认；在给用户的结论里必须单列「本次由我代为决定的事项」及依据，
                不得声称用户已确认，也不得把未确认当成已确认。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
      # 批㊶-I 段 C 单轨：vendor bash 通道关闭——bash 能力由 A7 atf_bash 承接
      # （白名单守卫＋命令分类＋命令串绝对路径扫描；atf-tools 插件挂载）。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
      # vendor pwsh 仅 Windows 语义（vendor 原行 !!js 条件在本部署面恒真）——Linux 恒关。
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true
      # vendor fs/search 保留挂载：glob/grep/read_image 经 pre-execute 白名单守卫
      # （atf-tools 路径守卫）；read/edit/write 由守卫恒 deny 并改道 atf_read/atf_edit/atf_write。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
      # 工具集差异（配置声明，禁 TS 分支）：训练链读技能只走 atf_skill_read（桥接契约面，
      # 带内核技能包版本）；vendor 技能目录会引入非 ATF 技能，属错误引导面——本预设关闭。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            disabled: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            disabled: true
      # 批㊶-I 段 B：goal 产品收敛——自主多轮循环是能力面开关，须显式开启。
      # 三行齐关（模型工具＋人类命令＋host 续轮引擎）才彻底；重开＝模板按实例
      # 显式开启三行＋收敛 maxGoalRounds（vendor 自报 blocked ≥3 轮机制照用）。
      # 重开时须覆写 create_goal 描述去掉"infer goal intent"推断授权，覆写不可行则维持 disabled。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            disabled: true
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
            disabled: true
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
