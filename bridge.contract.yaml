# =====================================================================
# bridge.contract.yaml — atf-harness 对 ATF 内核认知的唯一真相源
#
# 内容：JSONL 帧格式定义 + S1 协议常量 + atf CLI 对接面 + atf_upstream pin。
#       S3 工具子命令签名与 canonical output schema 随 S3 slice 在此登记。
#
# 变更纪律（AGENTS.md §4 / 任务书 §8.2）：
#   本文件任何变更 = 显式 PR + 双仓契约测试 + owner review；
#   双侧 contract_version 同步 bump，禁止任何一侧悄悄改。
#   pin 只落 ATF 发版 tag，禁止自动追新。
# =====================================================================

contract_version: 1

protocol:
  name: atf-bridge-jsonl
  version: 1
  transport: stdio            # TS harness 父进程 ↔ atf 子进程
  encoding: utf-8
  framing: 严格 LF 分帧——每行恰好一帧 JSON；行内不得出现裸 LF；CR 不预期出现
  max_frame_bytes: 1048576    # 单帧上限；超限按协议级失败处理（防御性常量，非协商项）

# ---------------------------------------------------------------------
# 帧定义（恰好三类。request: TS→内核；response/event: 内核→TS）
# ---------------------------------------------------------------------
frames:
  request:
    type: { const: request }
    id: { type: integer, rule: TS 侧自增，从 1 开始，单连接内唯一 }
    method: { type: string }
    params: { type: object, required: false }
  response:
    type: { const: response }
    id: { type: integer, rule: 必须回显对应 request 的 id }
    ok: { type: boolean }
    result: { rule: 仅当 ok=true 存在 }
    error:
      rule: 仅当 ok=false 存在
      fields:
        code: { type: string, rule: 机器可读错误码 }
        message: { type: string, rule: 人读摘要 }
        detail: { required: false }
  event:
    type: { const: event }
    name: { type: string }
    payload: { required: false }
    rule: 单向通知——无 id、不要求应答；不得影响 request/response 的 id 配对

# 协议级失败（坏 JSON 行 / 未知帧 type / 超限帧 / 对端意外退出）不设独立线缆帧：
# 一律在 TS 侧折算为 Result err（fail-closed，不重试、不猜测成功）。
# 【错误帧语义说明】本协议三类帧 = request / response / event（Phase 1 任务书 S1）；
# "错误帧"由 response 携带 ok=false 表达，不引入第四类线缆帧。
# 【决议登记 2026-09-08】owner 决议 ①1：三类帧 = request / response / event 维持不变，
# 不引入第四类独立 error 线缆帧（错误由 response.ok=false 表达）。

# ---------------------------------------------------------------------
# 生命周期
# ---------------------------------------------------------------------
lifecycle:
  spawn: TS 侧 spawn 子进程后立即执行握手；任一步失败 = err 并回收子进程
  handshake:
    method: atf.version
    params: null
    expect_result:
      name: { const: atf }
      version: { type: string, rule: 内核侧版本串，harness 不解析内容 }
      contract_version: { type: integer, rule: 与本文件 contract_version 不一致 = err(handshake_failed) }
  ready: 握手 response 收到且校验通过
  request_timeout_ms: 30000   # 初值常量；harness 内部实现细节，永不进入模型可见 schema
  timeout_semantics: 超时请求 = err(timeout)；连接随即标记失败并回收，后续请求 = err(closed)
  graceful_close:
    steps: TS 侧 end stdin → 等待对端退出
    ok_condition: 退出码 0
    else: err(peer_exit)
  unexpected_exit: 请求挂起期间对端退出 → 挂起请求 err(peer_exit) 并附 stderr 尾部摘要；不重试、不猜测成功

# ---------------------------------------------------------------------
# 方法面（S1 握手；S3 工具子命令签名 + ledger 方法在此登记）
#
# 【S3 登记 2026-09-09】owner 决议：v1 的完整方法面 = 握手 + 4 工具 + ledger 方法；
# 本次为任务书 §8.2 计划内方法面补登（签名 + canonical output schema），
# contract_version 维持 1 不 bump——仅帧格式 / 握手 schema / 既有方法语义变更才 bump。
#
# canonical output 纪律（任务书 §3.2 / owner 口径 #4）：
#   每个成功 response 的 result 必须通过其 canonical output schema 校验；
#   校验失败 = harness 侧 err(schema_violation)，结构化回填 ok:false，不猜测成功。
#
# 审批账本（ADR-07 账本轨；owner 口径 #1）：
#   ledger 查询/消费经桥接方法承载（harness 不直读文件），本阶段由契约 mock 对端
#   承载（MockLedger：预录 ledger_record / 查询 ledger_query / 消费 ledger_consume，
#   一次性消费语义在对端强制）；真实对端待内核能力落地 re-pin 后接入，不阻塞、不插队。
#   ledger_record 仅为测试/冒烟 setup 基建，非运行时方法面。
#
# 【exit 78 语义登记 2026-09-09】owner 口径 #3：approval_missing block 发生时，
#   由 harness 主进程以 exit code 78 终止（headless 冒烟断言锚点，
#   harness 侧 resolveHeadlessExitCode 为唯一出口）；"exit 78 由 atf 侧返回"
#   理解为内核侧真实实现时的语义约定，本阶段由 mock 承载。
#
# 【审批键 digest 算法登记】params_digest = sha256( hex, 小写 ) over
#   stableParamsJson = JSON.stringify( 键序递归排序后的 params )；
#   harness 侧与对端 MockLedger 同构实现，防审批键漂移。
methods:
  atf.version:
    direction: ts_to_kernel
    params: null
    result:
      name: atf
      version: string
      contract_version: integer

  # ---------------- 工具方法面（严格 4 个，owner 口径 #5；工具名即方法名） ----------------
  atf_admit_data:
    direction: ts_to_kernel
    requires_approval: true        # 写动作：数据准入（高危推进类，须账本预录）
    params:
      type: object
      required: [dataset_id]
      properties:
        dataset_id: { type: string }
        source: { type: string, required: false }
    result:                        # canonical output
      type: object
      required: [ok, journal_type, fact_id, sha256_digest]
      properties:
        ok: { const: true }
        journal_type: { type: string }
        fact_id: { type: string }
        sha256_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        dataset_id: { type: string, required: false }

  atf_gate:
    direction: ts_to_kernel
    requires_approval: true        # 闸门推进/查询（闸门语义，须账本预录；查询读态同为收敛面）
    params:
      type: object
      required: [gate, action]
      properties:
        gate: { type: string }
        action: { enum: [query, advance] }
        evidence_refs: { type: array, required: false, items: { type: string } }
    result:                        # canonical output——blocked 是合法业务产出（非错误）
      type: object
      required: [ok, gate, status]
      properties:
        ok: { const: true }
        gate: { type: string }
        status: { enum: [pass, blocked] }
        reason: { type: string, required: false }
        missing: { type: array, required: false, items: { type: string } }

  atf_surface_scan:
    direction: ts_to_kernel
    requires_approval: false       # 只读扫描
    params: { type: object, required: [], properties: {} }
    result:
      type: object
      required: [ok, surface, count]
      properties:
        ok: { const: true }
        count: { type: integer }
        surface:
          type: array
          items:
            type: object
            required: [journal_type, fact_id, sha256_digest]
            properties:
              journal_type: { type: string }
              fact_id: { type: string }
              sha256_digest: { type: string, pattern: "^[0-9a-f]{64}$" }

  atf_workspace_status:
    direction: ts_to_kernel
    requires_approval: false       # 只读查询
    params: { type: object, required: [], properties: {} }
    result:
      type: object
      required: [ok, run_id, admitted_count]
      properties:
        ok: { const: true }
        run_id: { type: string }
        admitted_count: { type: integer }

  # ---------------- 账本方法面（ADR-07 账本轨；本阶段 mock 承载） ----------------
  ledger_query:
    direction: ts_to_kernel
    params:
      type: object
      required: [tool, params_digest]
      properties:
        tool: { type: string }
        params_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
    result:
      type: object
      required: [ok, entries]
      properties:
        ok: { const: true }
        entries:
          type: array
          items:
            type: object
            required: [record_id, tool, params_digest, consumed]
            properties:
              record_id: { type: string }
              tool: { type: string }
              params_digest: { type: string }
              consumed: { type: boolean }

  ledger_consume:
    direction: ts_to_kernel
    params:
      type: object
      required: [record_id]
      properties:
        record_id: { type: string }
    result:
      type: object
      required: [ok, record_id, consumed]
      properties:
        ok: { const: true }
        record_id: { type: string }
        consumed: { const: true }

  ledger_record:                   # mock 测试/冒烟 setup 基建，非运行时方法面
    direction: ts_to_kernel
    params:
      type: object
      required: [tool, params_digest]
      properties:
        tool: { type: string }
        params_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
    result:
      type: object
      required: [ok, record_id]
      properties:
        ok: { const: true }
        record_id: { type: string }

# ---------------------------------------------------------------------
# atf CLI 对接面（pin v0.2.0b7 实测于 2026-09-08）
# ---------------------------------------------------------------------
atf_cli:
  path_env: ATF_CLI_PATH      # 指向 checkout 在 pin 上的 ATF 只读副本（目录）
  pin_check: 契约测试前置校验 `git -C "$ATF_CLI_PATH" rev-parse HEAD` 等于 atf_upstream.commit_sha，不一致直接 fail
  derive_command:             # 一次性调用由 ATF_CLI_PATH 派生，不依赖全局安装
    cwd: $ATF_CLI_PATH
    argv: [python3, -m, agentic_training_flow]
    env:
      PYTHONPATH: $ATF_CLI_PATH/src
      PYTHONDONTWRITEBYTECODE: "1"
  known_gaps:                 # 消除路径 = 按 AGENTS.md §4 / 任务书 §8.3.3 在 ATF 仓排队，本仓不阻塞、不插队
    - 无 --version 旗标（argparse 直接报"arguments are required: command"）→ 版本握手暂由会话方法 atf.version 承载
    - 无 JSONL 会话模式（当前为一次性子命令形态）→ S1 会话协议由契约忠实 mock 对端承载（harness 侧测试基建）；
      真实 CLI 的契约测试范围 = pin 校验 + derive_command 冒烟（--help 退出码 0）
  decision_20260908:           # owner 决议 ②1：批准在 ATF 仓立项排队（JSONL RPC 会话模式 + 版本子命令）
    atf_side_backlog: approved_pending_queue   # 立项与排期由 owner 主线按 §8.3.3 流程处理，本仓不插队
    harness_side: 本仓契约测试占位不变；内核落地后 re-pin 即启用真实 CLI 会话断言

# ---------------------------------------------------------------------
# 上游 pin（只落 ATF 发版 tag；re-pin 三步见 AGENTS.md §4，禁止自动追新）
# ---------------------------------------------------------------------
atf_upstream:
  tag: v0.2.0b7
  commit_sha: a628f8b8e23beff104b42b5c80088416ea78b394
  pinned_at: "2026-09-08"
  baseline: 全量基线 970 passed / 129 skipped（任务书 §8.4）
  contract_version: 1
