# 【版本轴注记（双轴明确）2026-09-13】《ATF-Harness_Owner指令_版本轴修正与推送_20260913.md》
# （依据《ATF内核_Owner决议与指令_B2-1验收_B2-2启动_双轴裁定_20260913.md》§3）。
# 自本注记起，contract_version 一词按两轴各归其位，禁止混用：
#   轴一·会话协议版本：两侧共有，经握手 atf.version.result.contract_version 传递；当前 = 1；
#     仅线缆规则（帧格式/握手 schema/生命周期语义）变更时双侧同步 bump；
#     harness 侧校验常量 = src/bridge/connection.ts::EXPECTED_SESSION_CONTRACT_VERSION；
#     内核侧承载 = session/contract.py::SESSION_CONTRACT_VERSION（内核保持 1 为正确）。
#   轴二·桥接契约版本：harness 独有，即本文件头部 contract_version；当前 = 3；
#     方法面/字段变更时 bump；仅 harness 内部（契约文件自检/文档）用，不参与握手校验；
#     harness 侧承载 = src/bridge/connection.ts::BRIDGE_CONTRACT_VERSION。
# 【问题存证】契约 v2 曾把握手期望值误绑到桥接契约版本（EXPECTED_CONTRACT_VERSION = 2），
# 而 mock 握手同步回 2 掩盖了该缺陷——re-pin 后首次握手即失败，且错误文案误导为"核对 pin"。
# 本注记即该缺陷的修正登记（六项修正详见《ATF-Harness_版本轴修正执行报告_20260913.md》）。
# 【bump 口径固化（D3 裁决 2026-09-14）】《ATF-Harness_Owner决议与指令_R2门1评审_门2放行_20260914.md》§2.3：
#   纯增量（新增方法、新增可选字段/参数、错误码枚举扩面）→ 补登登记，不 bump（沿用 atf.bind_run 先例）；
#   破坏性（改名、删字段、改既有字段语义、收窄枚举、帧/握手/生命周期变更）→ bump 桥接契约版本轴
#   （会话协议轴仅在线缆规则变更时单独处理）。
# ---------------------------------------------------------------------
# 【R2 契约补登登记 2026-09-14】《ATF-Harness_Owner决议与指令_R2门1评审_门2放行_20260914.md》D3：
#   atf_admit_data.params 增可选 pin（内核 v0.6.0b0 实测面：显式优先，缺省
#   canonical_digest({dataset_id, source_ref})[:12]）——纯增量补登，contract_version 不 bump。
# ---------------------------------------------------------------------

# 【契约 v3 修订登记 2026-10-25】owner 裁定《H-E9b 多类评估放行》：
#   contract_version: 2 → 3，变更清单：
#   1. atf_evaluate / atf_analyze_badcases 入参面纯增量：N>1 时按 run 槽位逐类下发
#      （内核 generate_eval_orchestration.py --run），单值三参降为可选覆盖（N=1 逐字不变）；
#   2. 返回体新增 groups[]（逐类 group 摘要）与 pooled_micro / pooled_per_unit / pooled_macro
#      三档池化键；旧键、旧值、旧错误码零改动（N=1 对外完全恒等）；
#   3. bump 依据：D3 口径中"新增可选字段"本属补登不 bump，本次由 owner 裁定 bump——
#      理由为评估面首次对外呈组维度，留版本号便于定位契约断点。
#   4. 两轴不混用：轴一（握手 contract_version，当前 = 1）本次零改动。
# ---------------------------------------------------------------------
contract_version: 3

protocol:
  name: atf-bridge-jsonl
  version: 1
  transport: stdio            # TS harness 父进程 ↔ atf 子进程
  encoding: utf-8
  framing: 严格 LF 分帧——每行恰好一帧 JSON；行内不得出现裸 LF；CR 不预期出现
  max_frame_bytes: 1048576    # 单帧上限；超限按协议级失败处理（防御性常量，非协商项）

# ---------------------------------------------------------------------
# 帧定义（恰好三类。request: TS→内核；response/event: 内核→TS）
# ---------------------------------------------------------------------
frames:
  request:
    type: { const: request }
    id: { type: integer, rule: TS 侧自增，从 1 开始，单连接内唯一 }
    method: { type: string }
    params: { type: object, required: false }
  response:
    type: { const: response }
    id: { type: integer, rule: 必须回显对应 request 的 id }
    ok: { type: boolean }
    result: { rule: 仅当 ok=true 存在 }
    error:
      rule: 仅当 ok=false 存在
      fields:
        code: { type: string, rule: 机器可读错误码 }
        message: { type: string, rule: 人读摘要 }
        detail: { required: false }
  event:
    type: { const: event }
    name: { type: string }
    payload: { required: false }
    rule: 单向通知——无 id、不要求应答；不得影响 request/response 的 id 配对

# 协议级失败（坏 JSON 行 / 未知帧 type / 超限帧 / 对端意外退出）不设独立线缆帧：
# 一律在 TS 侧折算为 Result err（fail-closed，不重试、不猜测成功）。
# 【错误帧语义说明】本协议三类帧 = request / response / event（Phase 1 任务书 S1）；
# "错误帧"由 response 携带 ok=false 表达，不引入第四类线缆帧。
# 【决议登记 2026-09-08】owner 决议 ①1：三类帧 = request / response / event 维持不变，
# 不引入第四类独立 error 线缆帧（错误由 response.ok=false 表达）。

# ---------------------------------------------------------------------
# 生命周期
# ---------------------------------------------------------------------
lifecycle:
  spawn: TS 侧 spawn 子进程后立即执行握手；任一步失败 = err 并回收子进程
  handshake:
    method: atf.version
    params: null
    expect_result:
      name: { const: atf }
      version: { type: string, rule: 内核侧版本串，harness 不解析内容 }
      contract_version: { type: integer, rule: 与本文件 contract_version 不一致 = err(handshake_failed) }
  ready: 握手 response 收到且校验通过
  request_timeout_ms: 30000   # 初值常量；harness 内部实现细节，永不进入模型可见 schema
  timeout_semantics: 超时请求 = err(timeout)；连接随即标记失败并回收，后续请求 = err(closed)
  graceful_close:
    steps: TS 侧 end stdin → 等待对端退出
    ok_condition: 退出码 0
    else: err(peer_exit)
  unexpected_exit: 请求挂起期间对端退出 → 挂起请求 err(peer_exit) 并附 stderr 尾部摘要；不重试、不猜测成功

# ---------------------------------------------------------------------
# 方法面（S1 握手；S3 工具子命令签名 + ledger 方法在此登记）
#
# 【S3 登记 2026-09-09】owner 决议：v1 的完整方法面 = 握手 + 4 工具 + ledger 方法；
# 本次为任务书 §8.2 计划内方法面补登（签名 + canonical output schema），
# contract_version 维持 1 不 bump——仅帧格式 / 握手 schema / 既有方法语义变更才 bump。
#
# canonical output 纪律（任务书 §3.2 / owner 口径 #4）：
#   每个成功 response 的 result 必须通过其 canonical output schema 校验；
#   校验失败 = harness 侧 err(schema_violation)，结构化回填 ok:false，不猜测成功。
#
# 审批账本（ADR-07 账本轨；owner 口径 #1）：
#   ledger 查询/消费经桥接方法承载（harness 不直读文件），本阶段由契约 mock 对端
#   承载（MockLedger：预录 ledger_record / 查询 ledger_query / 消费 ledger_consume，
#   一次性消费语义在对端强制）。
#   【K4 补登 2026-09-16】ledger_record 升为运行时方法面（内核已交付；口径＝内核
#   docs/architecture/stdio-session-contract.md §13.8；补登不 bump）：setup-only 预录
#   typed OperatorCommand 形成 approved 记录，写透 runs/<run_id>/facts/approval-ledger.jsonl
#   （由事实日志重放重建）；同 command_id 同内容重放幂等（不追加新行）；消费仍只经内核
#   CAS 路径与 ledger_consume。harness 侧 mock 对端暂按既有 wire 形态承载，re-pin 至含
#   K4 的内核版本时切换（不阻塞、不插队）。
#
#   【K3 补登 2026-09-17】atf_flow_anchor 升为运行时方法面（内核已交付；口径＝内核
#   docs/architecture/stdio-session-contract.md §13.9；补登不 bump）：流程位置纯读出口，
#   三态 current/stale/missing（missing＝run 尚无任何推进的合法态，非错误）。纯读＝方法体
#   只做参数解析＋K2 read_anchor 校验＋形状映射，不重算摘要、不重派生 phase、绝不写锚
#   （零第二真相源）。INV-A 消费纪律：harness 收到 stale 不得自行推断最新阶段（不得从
#   stale 响应或其它来源重派生 phase），最新派生投影只能由内核 writer 在下一次推进时写锚
#   产出；锚定返回值措辞纪律＝只能写「派生投影」。harness 侧 mock 对端暂按既有 wire 形态
#   承载，re-pin 至含 K3 的内核版本时切换（不阻塞、不插队）。
#
# 【exit 78 语义登记 2026-09-09】owner 口径 #3：approval_missing block 发生时，
#   由 harness 主进程以 exit code 78 终止（headless 冒烟断言锚点，
#   harness 侧 resolveHeadlessExitCode 为唯一出口）；"exit 78 由 atf 侧返回"
#   理解为内核侧真实实现时的语义约定，本阶段由 mock 承载。
#
# 【exit 75/79 枚举补登 2026-09-11】《ATF-Harness_Owner决议与启动指令_S1a验收_S1b收尾_20260911.md》
#   §2.3（承接 D1 闭合决议 §2.2 定案）：75 = suspended（非终态，审批应答等待超时挂起，
#   EX_TEMPFAIL 语义，resume 可续）；79 = aborted（终态，主动终止：应答 verdict=abort
#   或宿主 resume(abort)）。两码为枚举补登，不改既有 0/78/1 语义，不 bump contract_version；
#   映射仍经 harness 侧 resolveHeadlessExitCode() 单出口，终局语义保护条款延续。
#   退出码全表以本登记为准（session.contract.yaml 仅保留指向性引用，S1b 起不再单列）。
#
# 【审批键 digest 算法登记】params_digest = sha256( hex, 小写 ) over
#   stableParamsJson = JSON.stringify( 键序递归排序后的 params )；
#   harness 侧与对端 MockLedger 同构实现，防审批键漂移。
#
# 【审批账本键模型 v2（契约修订 2026-09-13，变更 #6）】
#   {tool, params_digest, consumed} 配额式键不再是账本键——查询/消费以内核 Approval Ledger
#   审批链为准（scope_ref 定位 + {approval_ref, record_id} 逐值一致消费）；tool + params_digest
#   降级为审计检索辅助信息（ledger_record setup 基建仍携带以便对账），如 harness 侧仍需按工具
#   检索，由本仓自行维护映射，不进内核账本。问答轨提案键（approval_key = params_digest）为
#   harness 内部状态键，不属账本键，维持不变。
methods:
  atf.version:
    direction: ts_to_kernel
    params: null
    result:
      name: atf
      version: string
      contract_version: integer

  # ---------------- 会话方法面（与 atf.version 同族，点号命名；非工具面） ----------------
  atf.bind_run:                    # 契约 v2 方法面补登（B1，2026-09-13）：会话级 run 绑定——
    direction: ts_to_kernel        #   宿主/长会话场景（Phase 3 dispatch）；编排层不依赖（见头部编排口径）
    params:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string }
    result:
      type: object
      required: [ok, run_id, scope_ref]
      properties:
        ok: { const: true }
        run_id: { type: string }
        scope_ref:
          type: object
          required: [project_id, scope_type, scope_id, scope_mode]
          properties:
            project_id: { type: string }
            scope_type: { type: string }
            scope_id: { type: string }
            scope_mode: { type: string }
    errors:                        # B3：错误语义（error response，连接保持）
      - unknown_run                # run_id 不存在/不可解析
    note: >-
      绑定留痕（B4）：重复绑定允许覆盖，但内核须发 event 留痕——
      name = "session/run-bound"，payload 含 from/to run_id。

  # ---------------- 工具方法面（R1 修订 2026-09-20：5 个——原「严格 4 个」owner 口径 #5 经 R1 立项
  #    扩为 5（owner 决议《ATF项目_Owner决议_R1立项_准入收进会话_20260920.md》sha 8b5458c0…）；
  #    工具名即方法名，唯点号方法因 provider 函数名限制经 executor 显式映射自下划线工具名
  #    （atf_data_admission_request／atf_preparation_propose／atf_style_cluster_execute）；
  #    【K-Gap-2 接线批补登 2026-09-21】工具面 5→7：新增 atf_preparation.propose（§13.11，
  #    纯读免审批）与 atf_style_cluster.execute（§13.12，写需审批），方法面 10→12（内核变更单
  #    《ATF内核_变更单_K-Gap-2料门对齐批_20260921.md》；对齐基准＝内核 stdio-session-contract
  #    §13.11/§13.12/§14）；【R-3 接线批补登 2026-09-23】工具面 7→9：新增 atf_label_qc.inspect
  #    （§13.13，写需审批）与 atf_label_qc.resolve（§13.14，写需审批），方法面 12→14（对齐基准＝
  #    内核 stdio-session-contract §13.13/§13.14/§14，owner 裁定《ATF_裁定_K2体检必经步化与
  #    K1闸门指引_20260923》§一.2）；两批补登均不 bump：轴一 contract_version 仍 1、轴二仍 2
  #    （§14 裁定 5 同款口径） ----------------
  atf_preparation.propose:         # K-Gap-2 补登（2026-09-21；内核冻结面实测 = kgap2 worktree a5fffae）
    direction: ts_to_kernel
    requires_approval: false       # 纯读：不写盘、不执行、锚不写（§13.11 纯读纪律）
    params:
      type: object
      required: [dataset_id]
      properties:
        dataset_id: { type: string, note: 注册标识符（登记面 fact_id 的 dataset_id 段）；非空、不含路径分隔符与 @ }
        pin: { type: string, required: false, note: 显式 pin；多 pin 未消歧 → dataset_not_registered（fail-closed） }
    errors:                        # §13.11 错误闭集（连接保持）
      - invalid_params             # dataset_id/pin 形态非法
      - dataset_not_registered     # 未登记/多 pin 未消歧（纯读对未知数据集不猜测）
    result:                        # canonical output（§13.11 返回面逐字段）
      type: object
      required: [ok, dataset_id, pin, fact_id, stage, cluster_material, explanation, human_summary]
      properties:
        ok: { const: true }
        dataset_id: { type: string }
        pin: { type: string }
        fact_id: { type: string, note: '"<dataset_id>@<pin>"' }
        stage: { enum: [cluster_confirmation, split_confirmation], note: 聚类确认/划分确认（按登记面聚类料现状判定） }
        cluster_material: { enum: [skills_ready, absent] }
        cluster_params_template: { type: object, required: false, note: 仅聚类阶段携带——六键能力闭集显式声明（无隐式缺省），取值以模板回显为单源 }
        policy_template: { type: object, required: false, note: 仅划分阶段携带——DatasetSplitPolicy/v2 骨架（默认 训练:测试 = 8:2 可改；policy_id/seed 模板置 null 须显式给出） }
        explanation: { type: object, note: 结构化事实性说明（策略语义/分层单位/比例/四维泄漏防护/聚类来源） }
        human_summary: { type: object, note: 人读投影六字段冻结表（owner 裁定方案 A）：headline/sections/metrics/actions/pending_confirmations/notes；下一动作由 actions[] 首条 needs_decision=false 承载；禁 code/schema 名/digest/gate 名直出 }

  atf_style_cluster.execute:       # K-Gap-2 补登（2026-09-21；写：确定性版式聚类＋落料＋留痕）
    direction: ts_to_kernel
    requires_approval: true        # 写动作：聚类产物落 registration 面＋journal 留痕（高危推进类）
    params:
      type: object
      required: [dataset_id, cluster_params]
      properties:
        dataset_id: { type: string, note: 同 propose 口径 }
        pin: { type: string, required: false }
        cluster_params:
          type: object
          note: >-
            聚类参数六键逐项显式声明（无隐式缺省）：algorithm_version/granularity/metric/
            linkage/threshold/min_cluster_size；键集须与能力闭集完全一致（缺/多键皆拒），
            值须逐字落内核闭集（bbox_layout_v1/page/cosine/average/auto_candidates/1）——
            校验归内核（invalid_params），harness schema 只做键声明（§13.12 能力闭集）
    errors:                        # §13.12 错误闭集（连接保持）
      - invalid_params
      - no_run_bound               # journal 留痕需要 run 语境（本方法不收 run_id）
      - dataset_not_registered     # 未登记/refs 缺 source_root
      - module_reason_passthrough  # 模块稳定原因码原样透出（source_symlink_forbidden /
                                   # source_package_taxonomy_unexpected / data_one_sided_pair /
                                   # style_cluster_page_limit / style_cluster_pages_required）
    result:                        # canonical output（§13.12 返回面逐字段）
      type: object
      required: [ok, run_id, dataset_id, pin, fact_id, assignment_ref, cluster_digest, cluster_count, clusters, no_feature_count, page_count, source, human_summary]
      properties:
        ok: { const: true }
        run_id: { type: string }
        dataset_id: { type: string }
        pin: { type: string }
        fact_id: { type: string }
        assignment_ref: { type: string, note: 登记面 style-cluster-assignment.json 引用 }
        cluster_digest: { type: string, pattern: "^[0-9a-f]{64}$", note: 可复算（canonical_digest） }
        cluster_count: { type: integer }
        clusters:
          type: array
          note: 按簇 id 稳定序；代表样本取簇内最小 sample_id（确定性）
          items:
            type: object
            required: [cluster_id, size, representative_sample_ref]
            properties:
              cluster_id: { type: string }
              size: { type: integer }
              representative_sample_ref: { type: string }
        no_feature_count: { type: integer }
        page_count: { type: integer }
        source: { const: kernel, note: 产物来源恒为内核（不冒充 skills 料） }
        human_summary: { type: object, note: 六字段冻结表（同 propose） }

  atf_label_qc.inspect:            # 【R-3 接线批补登 2026-09-23】工具面 7→9（方法面 12→14；
                                   # 内核 stdio-session-contract §13.13 实测 pin v0.7.4b0；
                                   # 补登不 bump：轴一 contract_version 仍 1、轴二仍 2——
                                   # K-Gap-2 同款口径）。写动作：不可变报告＋证据切片落登记面。
    direction: ts_to_kernel
    requires_approval: true        # 写动作：体检报告直接改变准入前置状态（pending>0 整体阻断）
    params:
      type: object
      required: [dataset_id]
      properties:
        dataset_id: { type: string, note: 注册标识符；非空、不含路径分隔符与 @ }
        pin: { type: string, required: false, note: 显式 pin；多 pin 未消歧 → dataset_not_registered（fail-closed） }
        qc_params:
          type: object
          required: false
          note: >-
            检测参数键闭集 {iou_threshold(0<θ≤1, 缺省 0.9), bounds_tolerance(≥0 像素, 缺省 0)}，
            未知键拒绝；无坐标制参数（检测恒在原像素坐标）；每个生效参数以 {value, overridden}
            记入报告（可缺省但无隐式不记录缺省）
    errors:                        # §13.13 错误闭集（连接保持）
      - invalid_params             # dataset_id/pin/qc_params 形态或键闭集越界
      - dataset_not_registered     # 未登记/refs 缺 source_root/多 pin 未消歧
      - label_qc_report_immutable_conflict  # 同 dataset@pin 异内容重写（fail-closed，切片亦不落盘）
      - internal_error             # 写盘失败
    result:                        # canonical output（§13.13 返回面逐字段）
      type: object
      required: [ok, dataset_id, pin, report_ref, report_file_sha256, report_digest, counts, human_summary]
      properties:
        ok: { const: true }
        dataset_id: { type: string }
        pin: { type: string }
        report_ref: { type: string, note: workspace 相对路径 datasets/<dataset_id>@<pin>/label-qc-report.json }
        report_file_sha256: { type: string, pattern: "^[0-9a-f]{64}$", note: 报告文件字节 SHA-256（落盘校验） }
        report_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$", note: 规范域 digest（去除 report_digest/human_summary 两键；可复算） }
        counts:
          type: object
          note: 冻结四键 total_items/pending/resolved/by_check_class ＋ 容错显式计数（samples_scanned/skipped_samples/image_size_conflict_samples/image_decode_unavailable_samples/other_files/unpaired_files/symlink_entries/truncated_pair_comparisons/truncated_items）
        human_summary: { type: object, note: 六字段冻结表（复用 _human_summary 渲染器；check_class 人读标签照冻结件 §1.5） }

  atf_label_qc.resolve:            # 【R-3 接线批补登 2026-09-23】工具面 7→9（方法面 12→14；
                                   # 内核 stdio-session-contract §13.14 实测 pin v0.7.4b0；
                                   # 补登不 bump）。写动作：裁决累积产物＋journal 留痕＋锚挂点。
    direction: ts_to_kernel
    requires_approval: true        # 写动作＋第二道人审（逐项裁决属用户确认面）
    params:
      type: object
      required: [dataset_id, actor, report_digest, decisions]
      properties:
        dataset_id: { type: string, note: 同 inspect 口径 }
        pin: { type: string, required: false }
        actor: { type: string, note: 裁决人标签（必填，仅审计留痕） }
        decided_at: { type: string, required: false, note: 携带时区的 ISO8601；naive 拒绝；缺省由内核记录接收时间 }
        report_digest: { type: string, note: 体检报告身份（inspect 返回值；幂等键 = item_id + report_digest） }
        decisions:
          type: array
          note: >-
            裁决批次（非空；分批 partial 可按项增量提交，同一 report_digest）。逐项：
            {item_id, action: accept|reject|modify, disposition?, modified_value?,
            target_field?, target_candidate_id?, keep_ref?, reason_text?, evidence_ref?, judgements?}。
            reject＝不处置/维持原状≠剔除（disposition 省略或 no_action）；accept/modify ⇒
            disposition 落检查类允许组合闭集且≠no_action（q1→{dedupe}／q2→{keep_first,
            keep_second, keep_both, drop_both, set_value}／q3→{set_value, fix_field, drop_both}／
            q4→{clip_to_bounds}；九项闭集 keep_first/keep_second/keep_both/drop_both/set_value/
            dedupe/fix_field/clip_to_bounds/no_action），并齐备必填附加字段（dedupe→keep_ref
            (marks[<下标>])、keep_first/keep_second→target_candidate_id、keep_both/drop_both→
            reason_text、set_value→modified_value、fix_field→target_field）；Q2 项须附判断依据
            （evidence_ref 或非空 judgements:[{item_id, basis: multimodal|user, ...}] 至少其一）。
            校验归内核（invalid_params 结构化 detail）；未决项绝不默认处置
    errors:                        # §13.14 错误闭集（连接保持）
      - invalid_params
      - no_run_bound               # journal 留痕需要 run 语境（本方法不收 run_id）
      - dataset_not_registered
      - label_qc_report_missing    # 报告不存在
      - label_qc_report_digest_mismatch  # 磁盘报告与其 digest 不符/裁决批引用身份不一致/既有裁决产物绑定漂移
      - label_qc_decision_conflict # 同幂等键异值（结构化双 digest；harness 转请示勿重试覆盖）
      - judgement_evidence_conflict
      - evidence_ref_outside_workspace
      - evidence_digest_mismatch
      - internal_error
    result:                        # canonical output（§13.14 返回面逐字段）
      type: object
      required: [ok, dataset_id, pin, resolved_count, pending_count, decisions_ref, decisions_sha256, human_summary]
      properties:
        ok: { const: true }
        dataset_id: { type: string }
        pin: { type: string }
        resolved_count: { type: integer }
        pending_count: { type: integer, note: 有效 pending＝报告项集合 − 已裁决项集合（裁决产物累积推导） }
        decisions_ref: { type: string, note: 登记面 label-qc-decisions.json 引用 }
        decisions_sha256: { type: string, pattern: "^[0-9a-f]{64}$", note: 产物文件字节 SHA-256 }
        human_summary: { type: object, note: 六字段冻结表（裁决进度投影） }

  atf_admit_data:
    direction: ts_to_kernel
    requires_approval: true        # 写动作：数据准入（高危推进类，须账本预录）
    # 【登记面双形态补登 2026-09-21】内核件B v0.7.2b0 实义变更（实测锚 main 61631e6；补登不 bump）：
    #   显式形态 {dataset_id, source_ref?, pin?}＝引用式登记（refs 仅 source_ref 档案，
    #   不被 atf_data_admission.request 定位消费——缺源根即 dataset_not_registered）；
    #   自动形态 {source_root, split_root, pin?, label?}（无 dataset_id）＝内容寻址登记，
    #   dataset_id 由内核按双树 digest 派生 ds-<digest12>，refs 写双源根 → 准入可定位；
    #   两形态互斥（混用 invalid_params，双向把守）；label 仅展示字段。
    params:
      type: object
      required: []                 # 双形态：形态完整性由内核 fail-closed 校验（invalid_params），harness 不做第二权威
      properties:
        dataset_id: { type: string, required: false, note: 仅显式形态；非空、不含路径分隔符与 @；自动形态勿传（内核派生 ds-<digest12>） }
        source_ref: { type: string, required: false, note: 仅显式形态；非空字符串自由文本（refs 档案）；与自动形态字段互斥 }
        source_root: { type: string, required: false, note: 仅自动形态；成对标注来源包根，必须为存在目录（绝对原样/相对按 workspace 根）；symlink fail-closed }
        split_root: { type: string, required: false, note: 仅自动形态；split manifest 根，必须为存在目录 }
        label: { type: string, required: false, note: 仅自动形态；人类可读展示名（只进 registration.json，不参与派生） }
        pin: { type: string, required: false, note: R2 补登（D3，2026-09-14）——显式优先；缺省 = canonical_digest({dataset_id, source_ref})[:12]（显式形态口径；自动形态 source_ref 恒空串，同式推导）}
    result:                        # canonical output（契约 v2 三元组来源明示，变更 #7）
      type: object
      required: [ok, journal_type, fact_id, sha256_digest]
      properties:
        ok: { const: true }
        journal_type: { type: string, note: 固定 "dataset-registry" }
        fact_id: { type: string, note: '"<dataset_id>@<pin>"（pin 取值来源由批次二任务书明确）' }
        sha256_digest: { type: string, pattern: "^[0-9a-f]{64}$", note: 数据集登记记录的 canonical digest }
        dataset_id: { type: string, required: false }

  atf_gate:
    direction: ts_to_kernel
    requires_approval: true        # 闸门推进/查询（闸门语义，须账本预录；查询读态同为收敛面）
    params:
      type: object
      required: [gate, action]
      properties:
        gate:
          type: string
          note: >-
            命名分流（契约 v2 变更 #3，fail-closed 不猜测）：
            ^G[1-4]$（大小写不敏感，内部归一化为大写）→ 数据准入闸（固定顺序 G1–G4）；
            其余取值必须命中七组完整性 GateId；两者都不命中 → error response unknown_gate。
        action: { enum: [query, advance] }
        evidence_refs: { type: array, required: false, items: { type: string } }
    result:                        # canonical output——blocked/warn 是合法业务产出（非错误）
      type: object
      required: [ok, gate, status]
      properties:
        ok: { const: true }
        gate: { type: string }
        status:
          enum: [pass, warn, blocked]   # 契约 v2（变更 #2）：增补 warn（内核三值 pass/warn/block，blocked 保既有命名）
        reason_codes: { type: array, required: false, items: { type: string }, note: 内核稳定原因码（blocked/warn 时给出） }
        requires_human_review: { type: boolean, required: false }
        evidence: { type: array, required: false, items: { type: string }, note: 证据引用（不复制内容） }
        reason: { type: string, required: false, note: 兼容字段（v1 既有），建议由 reason_codes 派生 }
        missing: { type: array, required: false, items: { type: string }, note: 兼容字段（v1 既有），建议由 reason_codes 派生 }

  atf_fact_scan:                   # 契约 v2（变更 #1）：原 atf_surface_scan 改名 + 数组字段 surface → facts
    direction: ts_to_kernel
    requires_approval: false       # 只读扫描
    params:                        # 契约 v2 补登（B2，2026-09-13）：可选 run_id——显式 run_id 优先于会话绑定
      type: object
      required: []
      properties:
        run_id: { type: string, required: false }
    errors:                        # 契约 v2 补登（B3）：错误语义（error response，连接保持）
      - no_run_bound               # 未绑定且未显式给 run_id（fail-closed）
      - unknown_run                # run_id 不存在/不可解析
    result:
      type: object
      required: [ok, facts, count]
      properties:
        ok: { const: true }
        count: { type: integer, note: 自洽校验——必须等于 facts 数组长度 }
        facts:
          type: array
          note: >-
            语义（契约 v2）：枚举本 run 可被引用的事实索引；只读、只给引用不给内容副本。
            v1 覆盖两类事实：operation-journal（run 原产地流水逐行事件，
            fact_id="journal-event:<run_id>:<行号>"）与 dataset-registry
            （datasets/<dataset_id>@<pin>/registration.json，fact_id="<dataset_id>@<pin>"）；
            三元组与 domain_refs 字段名完全一致；评估/校验证据类列入后续增量。
          items:
            type: object
            required: [journal_type, fact_id, sha256_digest]
            properties:
              journal_type: { type: string }
              fact_id: { type: string }
              sha256_digest: { type: string, pattern: "^[0-9a-f]{64}$" }

  atf_workspace_status:
    direction: ts_to_kernel
    requires_approval: false       # 只读查询
    params:                        # 契约 v2 补登（B2，2026-09-13）：可选 run_id——显式 run_id 优先于会话绑定
      type: object
      required: []
      properties:
        run_id: { type: string, required: false }
    errors:                        # 契约 v2 补登（B3）：错误语义（error response，连接保持）
      - no_run_bound               # 未绑定且未显式给 run_id（fail-closed）
      - unknown_run                # run_id 不存在/不可解析
    result:                        # 契约 v2（变更 #8）：增补 scope_ref（供 ledger_query 定位）
      type: object
      required: [ok, run_id, admitted_count, scope_ref]
      # 【F6 补登 2026-09-21（harness 侧小批；内核 §一 合回后按真实形态逐条对齐）】状态面
      # 数据集概览透传——root 严格模式关闭（内核多返回顶层字段不 fail-closed），深形态校验
      # 归内核（不引入第二权威）；登记段补登不 bump（轴一仍 1／轴二仍 2）。
      properties:
        ok: { const: true }
        run_id: { type: string }
        admitted_count: { type: integer }
        scope_ref:
          type: object
          required: [project_id, scope_type, scope_id, scope_mode]
          properties:
            project_id: { type: string }
            scope_type: { type: string }
            scope_id: { type: string }
            scope_mode: { type: string }
        datasets: { type: array, required: false, note: 数据集概览（已登记 dataset_id＋pin 可多个＋来源根相对形态摘要＋最近登记时间；不含源路径直出），items 为开放映射对象 }
        human_summary: { type: object, required: false, note: 状态面人读双层报告（若内核给，harness 直渲染；禁直出 code/schema 名/digest）

  atf_data_admission.request:      # R1 补登（2026-09-20）：准入收进会话（K-Gap-1 方案 C 接线；
    direction: ts_to_kernel        # 内核冻结面实测 = main 61631e6；模型面工具名 atf_data_admission_request）
    requires_approval: true        # 写动作：真实数据准入（高危推进类；走既有 B8 问答轨/账本轨，零新审批语义）
    params:                        # 内核冻结面最小闭集；两者均不含路径分隔符与 @，缺省未知参数不消费
      type: object
      required: [dataset_id]
      properties:
        dataset_id: { type: string, note: 取自 atf_admit_data 登记结果 fact_id（形如 <dataset_id>@<pin>）或事实索引登记事实；不接受文件路径 }
        pin: { type: string, required: false, note: 显式 pin；多 pin 登记且未显式 → dataset_not_registered（fail-closed） }
        # 【K-Gap-2 扩展补登 2026-09-21（§13.10；补登不 bump）】可选确认态——经用户确认的
        # 完整策略 payload 对象（不接受自由文本）；深度校验归内核（DatasetSplitPolicy/v1|v2、
        # target_ratios 和为 1、style_cluster_assignment_ref 非空、可选 training_lanes 非空无
        # 重复、unit 全覆盖），失败 → invalid_params。policy 取值优先级＝确认态 > 登记面
        # refs.split_policy_ref（skills 建议）> 诚实拒绝（split_policy_missing）；
        # harness 只透传，不实现优先级逻辑、禁静默补齐/静默换策略。
        split_policy: { type: object, required: false, note: 经确认的划分策略完整 payload（骨架以 atf_preparation.propose 的 policy_template 为基准）；缺省＝按登记面 skills 建议划分，两者皆无 → split_policy_missing }
    errors:                        # 内核冻结面错误语义（error response，连接保持）
      - invalid_params             # dataset_id/pin 形态非法（与登记面同口径）；split_policy 校验失败同码
      - no_run_bound               # 会话未绑定 run
      - unknown_run                # run 不可解析
      - dataset_not_registered     # 未登记/多 pin 未显式/登记记录缺可解析源根（fail-closed）
      - split_policy_missing       # 【K-Gap-2 补登】无确认态且无 skills 建议（诚实拒绝，不透传不猜）
      - split_recompute_cluster_required  # 【K-Gap-2 补登】既无聚类料也不选免聚类策略（诚实停止）
      - module_reason_passthrough  # 模块稳定原因码原样透出（如 source_workspace_overlap_forbidden）
    result:                        # canonical output（闭集＝内核返回面逐字段）
      type: object
      required: [ok, run_id, dataset_id, pin, fact_id, status, summary_ref, summary_sha256, gates]
      properties:
        ok: { const: true }
        run_id: { type: string }
        dataset_id: { type: string }
        pin: { type: string }
        fact_id: { type: string, note: '"<dataset_id>@<pin>"' }
        status:
          enum: [not_required, waiting_on_human, adjudicated, temporarily_excluded]
          note: 准入模块裁决状态；waiting_on_human＝诚实停止（恢复走既有 data.annotation.adjudicate.v1 流），不阻塞不猜测
        summary_ref: { type: string, note: workspace 相对路径（runs/<run_id>/l1/<dataset_id>@<pin>/…） }
        summary_sha256: { type: string, pattern: "^[0-9a-f]{64}$", note: summary 文件字节摘要，可独立复算 }
        gates:
          type: array
          note: G1–G4 判定投影（×4；summary 是 G1–G4 判定唯一来源）
          items:
            type: object
            required: [gate_id, verdict, reason_codes]
            properties:
              gate_id: { type: string }
              verdict: { type: string }
              reason_codes: { type: array, items: { type: string } }
        requests: { type: array, required: false, note: 仅 waiting_on_human 携带（标注冲突裁决请求集） }
        # 【K-Gap-2 返回扩展补登 2026-09-21（§13.10；补登不 bump）】
        policy: { type: object, required: false, note: '{source: confirmed|suggested|null, digest, deviation?}——确认态相对建议的偏离 diff＋可复算 digest' }
        style_cluster_source: { type: string, required: false, note: skills | kernel | null（聚类料来源，不冒充） }
        allocation_unit_source: { type: string, required: false, note: provided_split_manifest | derived_from_source（单元来源显式标注） }
        partition_counts: { type: object, required: false, note: 分区计数（泄漏审计产物投影） }
        human_summary: { type: object, required: false, note: 六字段冻结表（§13.11 同款；说明划分方式/泄漏防护/数据来源/闸门结果；下一动作由 actions[] 首条 needs_decision=false 承载） }

  # ---------------- 账本方法面（ADR-07 账本轨；本阶段 mock 承载；键模型 v2 见头部登记） ----------------
  ledger_query:                    # 契约 v2（变更 #4）：scope_ref(+operation_id) 查询，审批链形态
    direction: ts_to_kernel
    params:
      type: object
      required: [scope_ref]
      properties:
        scope_ref:
          type: object
          required: [project_id, scope_type, scope_id, scope_mode]
          properties:
            project_id: { type: string }
            scope_type: { type: string }
            scope_id: { type: string }
            scope_mode: { type: string }
        operation_id: { type: string, required: false }
        state: { type: string, required: false }
        include_consumed: { type: boolean, required: false, note: 缺省 false——只返回可消费记录（state=approved 且未 consumed） }
    result:
      type: object
      required: [ok, records]
      properties:
        ok: { const: true }
        records:
          type: array
          items:
            type: object
            required: [record_id, approval_id, sequence, state]
            properties:
              record_id: { type: string }
              approval_id: { type: string }
              sequence: { type: integer, note: 审批链序号 }
              state: { type: string, note: '"approved" | "consumed"（内核审批链状态)' }
              command_id: { type: string, required: false }
              actor: { type: string, required: false }
              operation_id: { type: string, required: false }
              attempt_id: { type: string, required: false }
              evidence_refs: { type: array, required: false, items: { type: string } }

  ledger_consume:                  # 契约 v2（变更 #5）：{approval_ref, record_id} 逐值一致消费
    direction: ts_to_kernel
    params:
      type: object
      required: [approval_ref, record_id]
      properties:
        approval_ref: { type: string, note: 审批标识（对应记录的 approval_id） }
        record_id: { type: string }
    result:
      type: object
      required: [ok, record_id, state]
      properties:
        ok: { const: true }
        record_id: { type: string }
        state: { const: consumed }
    errors:                        # 错误语义（连接保持）：契约 v2 登记
      - approval_already_consumed  # 重复消费
      - approval_record_mismatch   # approval_ref 与 record_id 不匹配
      - not_found                  # 记录不存在

  ledger_record:                   # 【K4 补登 2026-09-16】运行时方法面（内核 §13.8；补登不 bump）——setup-only 预录
    direction: ts_to_kernel        #   同 command_id 同内容重放幂等；消费仍只经内核 CAS 与 ledger_consume
    params:
      type: object
      required: [scope_ref, command_id, actor, operation_id, attempt_id, subject_ref, evidence_refs]
      properties:
        scope_ref:
          type: object
          required: [project_id, scope_type, scope_id, scope_mode]
          properties:
            project_id: { type: string }
            scope_type: { type: string }
            scope_id: { type: string }
            scope_mode: { type: string }
        command_id: { type: string }
        actor: { type: string }
        operation_id: { type: string }
        attempt_id: { type: string }
        subject_ref: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        run_id: { type: string, required: false }   # 显式覆盖会话绑定（写透定位用，内核 §13.0 覆盖口径）
    result:
      type: object
      required: [ok, command_id, record_id, state]
      properties:
        ok: { const: true }
        command_id: { type: string }
        record_id: { type: string }                  # 形态 <approval-record:<subject_ref>:<序号>>；可被 ledger_consume 一次性消费
        state: { const: recorded }
    errors:                        # 错误语义（连接保持）：内核 §13.8 登记
      - approval_command_conflict  # 同 command_id 不同内容
      - no_run_bound               # 未绑定且未显式 run_id
      - unknown_run                # run 不存在
      - facts_log_tail_corrupt     # 事实日志尾损坏（bind 与写透均 fail-closed）
      - facts_log_digest_mismatch  # 事实日志摘要不符
      - facts_log_chain_broken     # prev_digest 链断裂

  # ---------------- 流程位置纯读出口（K3；下划线命名，非点号族、非工具面、不进审批面） ----------------
  atf_flow_anchor:                 # 【K3 补登 2026-09-17】运行时方法面（内核 §13.9；补登不 bump）——流程位置纯读出口
    direction: ts_to_kernel        #   三态 current/stale/missing；INV-A 消费纪律与措辞纪律见头部【K3 补登】注记
    params:
      type: object
      required: []
      properties:
        run_id: { type: string, required: false }   # 显式优先于会话绑定（批次二先例）；未绑定且未显式 → no_run_bound
    result:                        # 纯读：只做参数解析＋K2 read_anchor 校验＋形状映射；不重算摘要、
      type: object                 #   不重派生 phase、绝不写锚（零第二真相源）；按 anchor_status 三态返回
      required: [ok, run_id, anchor_status]
      properties:
        ok: { const: true }
        run_id: { type: string }
        anchor_status: { enum: [current, stale, missing] }
        anchor: { type: string, required: false, note: 仅 current——TrainingFlowAnchor/v1 文档，与 runs/<run_id>/anchor.json 逐字一致（派生投影） }
        anchor_phase: { type: string, required: false, note: 仅 stale——锚内 phase；不返回重生后的 phase、不含 blocked（内核 A④） }
        as_of_digest: { type: string, required: false, note: 仅 stale——当前重算摘要 }
        expected_as_of_digest: { type: string, required: false, note: 仅 stale——锚内摘要 }
    errors:                        # 错误语义（连接保持）：内核 §13.9 登记
      - no_run_bound               # 未绑定且未显式 run_id
      - unknown_run                # run 不存在
      - anchor_document_invalid    # 锚文件非法 JSON/非对象/schema_version 不符/必需顶层字段缺失或非字符串/derived_from 四键缺失（K3 新增，fail-closed 兜底）
      - facts_log_tail_corrupt     # facts 日志损坏透传 K4 原因码（facts_log_* 族）
      - facts_log_digest_mismatch
      - facts_log_chain_broken

