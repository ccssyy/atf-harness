#       S3 工具子命令签名与 canonical output schema 在 methods 段登记。
#
# 变更纪律（AGENTS.md §4 / 任务书 §8.2；版本轴口径见下方「版本轴注记」）：
#   本文件任何变更 = 显式 PR + 双仓契约测试 + owner review；
#   版本轴各归其位：会话协议版本仅线缆规则变更时双侧同步 bump；
#   桥接契约版本（本文件头部 contract_version）在方法面/字段变更时 bump（harness 独有，不进握手）；
#   任何一侧均禁止悄悄改。pin 只落 ATF 发版 tag，禁止自动追新。
