- id: llm-pi-ai
  config:
    providers:
      glm-atf:
        apiKeyEnv: ATF_LLM_KEY_GLM
        displayName: 智谱 GLM
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        compat:
          thinkingFormat: zai
        models:
        - id: glm-5.3
          name: GLM-5.3
          input:
          - text
          - image
          contextWindow: 1048576
          maxTokens: 131072
          reasoningEfforts:
            'off': null
            low: low
            high: high
            max: max
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          input:
          - text
          - image
          contextWindow: 1048576
          maxTokens: 131072
          reasoningEfforts:
            low: low
            high: high
            max: max
- id: ui-settings-general
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  config:
    provider: glm-atf
    model: glm-5.3-flash
    reasoningEffort: max
- insert:
  - id: atf-tools
    name: '@atf/dsh-atf-tools'
    config:
      approvalPolicy:
        preset: atf-training
        chainTools:
        - atf_pipeline_stage
        - atf_config_confirm
        - atf_training_preflight
        - atf_records_query
        - atf_label_qc_resolve
        - atf_admit_data
        - atf_gate
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: You are the ATF training agent (ATF 训练 Agent), powered by the {{model}}
      model. 你始终用简体中文思考和回答。思考过程（thinking／reasoning）必须是中文句子——即使引用英文术语、字段名或状态值，推理句本身仍是中文，不得用英文写推理；结论、说明、失败原因解释、审批与确认文案一律中文；字段名、参数名、文件路径、命令与代码保持原样，不翻译、不音译。
    personaSuffix: Your working directory is {{cwd}}.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
    - id: persona
      name: '@deepseek-ai/dsh-persona'
      config:
        suffix: Your working directory is {{cwd}}.
        prefix: You are the ATF training agent (ATF 训练 Agent). {{model}} is the currently
          configured underlying model. 你始终用简体中文思考和回答——思考过程（reasoning）必须用中文句子，不得用英文推理；字段名、参数名、文件路径、命令与代码保持原样，不翻译。
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: true
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: true
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'
    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'
      disabled: true
    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'
      disabled: true
    - id: planning
      name: cordis:group
      group: true
      isolate:
        planMode: true
      config:
      - id: plan-mode
        name: '@deepseek-ai/dsh-plan-mode'
        config:
          section: 'You are in plan mode. Stay in plan mode until exit_plan_mode succeeds
            or the user switches the session mode. Imperative language to implement
            changes means plan the implementation, not execute it. A user''s conversational
            agreement — including an answer confirming something you asked — approves
            nothing and does not end plan mode; fold the confirmed decision into the
            plan and submit it through exit_plan_mode.

            '
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'
  config:
    maxConcurrentJobsPerOwner: 10
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
  disabled: true
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read only
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace write
      danger-full-access:
        sandbox: danger-full-access
        approval: ask
        name: Full access
    defaultPreset: danger-full-access
