# 批⑱-M0 PoC：GLM 接入（ATF 既有授权线；key 走 env 引用——红线"key 不落配置"）。
# 覆盖 llm-pi-ai 行（dsh-base 里 mount dormant：零路由）——override 语义为整行替换。
# base_url＝ATF 授权线的 GLM coding 端点（与 /root/.atf-harness/llm.json glm 条目同源）。
# 启动前置：source /root/.atf-harness/.env（注入 ATF_LLM_KEY_GLM 进进程 env——
# dsh-base credentials 语义＝inherited environment 优先，按请求解析，不落盘）。
- id: llm-pi-ai
  config:
    providers:
      glm-atf:
        apiKeyEnv: ATF_LLM_KEY_GLM
        displayName: GLM（ATF 授权线）
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        # 批㊵（D-LLM-1 R3 WebUI 面 · A 面）：推理档位声明——thinkingFormat=zai（GLM coding
        # 端点思考协议：thinking 二态＋reasoning_effort 档位）；reasoningEfforts 照 pi-ai 目录
        # zai-coding-cn 条目 glm-5.3 的 thinkingLevelMap 原文（off/low/high/max——不造档位），
        # 激活 dsh 原生模型选择器「推理等级」子菜单（ui-model-selection）。能力面同源声明：
        # contextWindow/maxTokens＝目录值（用户可用到模型上限，D-LLM-1 R4 不预降）。
        compat:
          thinkingFormat: zai
        models:
          - id: glm-5.3-flash
          - id: glm-5.3
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: glm-atf
    model: glm-5.3
# 批⑱-M1：atf_* 工具投影插件（@atf/dsh-atf-tools——本仓 packages/extensions/atf-tools，
# 经 ATF-Harness/node_modules symlink 消费；vendor 源码零改动）
- insert:
    - id: atf-tools
      name: '@atf/dsh-atf-tools'
# 批㊳ M3-1（档二品牌 · 轴 A）：system-prompt 行整行替换——includeHarnessIdentity:false
# 关掉首段 "You are an AI agent powered by DeepSeek Harness."；personaPrefix 换 ATF 身份
# （{{model}}/{{cwd}} 为已注册变量）；personaSuffix 必须重述（漏重述即丢段——方案 §五.4）。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are the ATF training agent (ATF 训练 Agent), powered by the {{model}} model.
    personaSuffix: Your working directory is {{cwd}}.

# 批㊴ M3-1 收尾（owner 两裁 10-06 11:55 选项 A＋措辞定调）：preset-standard persona 覆写——
# web 会话缺省走 agent preset，其 persona 插件按设计遮蔽部署级 persona（system-prompt 行对
# preset 作用域不生效）；本行照 Web 编辑器保存形态按 id 整行覆写（plugins 全量重述），仅 persona
# prefix 换 owner 定稿：自称只提 ATF 训练 Agent，不绑模型厂商/型号（模型可切换——禁"由 X 驱动"式）。
# 维护代价（选项 A 声明）：vendor bump 时 preset 上游变更不自动流入，须随 bump 重同步本覆写行
# （重放清单见 vendor/dsh/patches/README.md）。
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: You are the ATF training agent (ATF 训练 Agent). {{model}} is the currently configured underlying model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
