# contract_version / schema_version 均不 bump；事件类型集合 12 类不变、保留位仍空）：
#   1. N1 语义边界：闸门推进（atf_gate advance）的留痕载体 = 既有 tool/result 事件——
#      它是**客户端观察事实**（"我方调用 atf_gate 并收到响应"），**不是**内核状态的权威副本；
#      不得以"再查内核"作为恢复依据（内核内存态重启后为空，"不存在"≠"未推进"）；
#      若将来审计需要独立检索"守卫拒绝/闸门推进"，须评估第 13 类扩面（owner 批准）。
#   2. TEM 读闸注入点（v1 桩，缺省无注入 = 无记忆运行）：发生在 transformContext 投影之后、
#      provider.decide() 之前（runner 内，不另起注入通道，不落事件流）；注入条目为合成上下文项
#      （type=user/message + synthetic:true + payload.source_ref/kind/content），
#      structural_preconditions 类携带 pinned 标记（折叠语义不得吃掉引用链）；
