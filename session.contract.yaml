# =====================================================================
# session.contract.yaml — atf-harness 会话事件流（schema v1）与落盘形态契约
#
# 定位说明：bridge.contract.yaml 是 harness 对 ATF 内核认知的唯一真相源；
# 本文件登记的是 harness 本地会话层的 schema 与落盘形态（ADR-06 / Phase 1
# 任务书 S2 / owner 启动指令口径 #4 / Phase 2 P2-S1），不涉及内核对接面。
# 二者互不隶属，任何一侧变更各自走显式 PR + owner review。
#
# 依据：ADR-06（双层引用，附三条落地细则）+ Phase 1 任务书 §2 +
#       《ATF-Harness_Owner启动指令_Phase1_S2_20260909.md》口径 #1–#4 +
#       Phase 2 任务书 §2 + 《ATF-Harness_Owner决议与启动指令_D1闭合_P2S1启动_20260910.md》口径 #1–#5
#       + ADR-09（ACP 消费面定型）C4/C5。
# =====================================================================

contract_version: 1
schema_version: 1            # v1（P2-S1 完成 v0 → v1 bump；S1a 定义修正：集合 11 → 12 类，
                             # 依决议 §2.1.6 属 v1 修正窗口内，不构成 v1 → v2，版本号不 bump）

# ---------------------------------------------------------------------
# 事件类型枚举（schema v1：12 类，S1a 定义修正后定死；原口径 #1 / ADR-09 C4）
# enabled = 本阶段可写入；reserved = 已登记未启用（P2-S2/S3 启用），
# 写入与落盘流中出现一律拒绝（未启用 type 一律拒绝，沿用 v0 白名单纪律）
# ---------------------------------------------------------------------
event_types:
  - user/message             # 用户输入                      [enabled]
  - assistant/message         # 助手对模型历史的正式输出        [enabled]
  - assistant/attempt        # 失败尝试：落盘但不进模型历史（transformContext 过滤）[enabled]
  - tool/call                # 工具调用发起                  [enabled]
  - tool/result              # 工具结果回填                  [enabled]
  - turn/start               # 轮次开始                     [enabled]
  - turn/end                 # 轮次结束                     [enabled]
  - session/compaction       # 压缩动作审计留痕（P2-S1）      [enabled]
  - session/repair           # 尾部残段截断修复留痕（S1a，与截断成对写入）[enabled]
  - approval/request         # 审批请求（保留位，P2-S2 启用） [reserved]
  - approval/response        # 审批应答（保留位，P2-S2 启用） [reserved]
  - provider/switch          # provider 热切换（保留位，P2-S3 启用）[reserved]
  rule: 未知 type 一律拒绝写入（append err(schema_violation)）；
        reserved type 写入与出现于落盘流均 err(schema_violation)（未启用即拒，fail-closed）；
        replay 遇上述两类 type = err(schema_violation)（fail-closed，视为文件被篡改/超前版本）

# ---------------------------------------------------------------------
# 事件 schema（每条事件恰好一行 JSON）
# ---------------------------------------------------------------------
event:
  id: { type: integer, rule: 从 1 自增；落盘流内严格连续递增，replay 校验，违反 = err(corrupt_stream) }
  ts: { type: string, rule: ISO 8601 UTC（Date.parse 可解析），由 harness 写入时生成 }
  type: { type: string, rule: 须 ∈ event_types 白名单 }
  payload: { type: any, required: true, rule: 任意 JSON 值（含 null）；写入时须可被 JSON 序列化 }
  projection:
    required: true
    fields:
      evidence_event: { type: [string, "null"], rule: Phase 3 前恒为 null（ADR-06 细则 3 字段位）；
                        值非 null = err(schema_violation)，防止提前激活 }
  domain_refs:                # 可选；双层引用（ADR-06 细则 1）：digest 是唯一合法引用形态
    type: array
    items:
      journal_type: { type: string, minLength: 1, rule: 内核侧 journal 类型名，harness v0 不做枚举收敛 }
      fact_id: { type: string, minLength: 1 }
      sha256_digest: { type: string, rule: 64 位小写 hex（^[0-9a-f]{64}$ 语法校验） }
    rule: 空数组语义 = 无引用（不触发校验）；事件不含事实内容副本
  ui: { type: object, required: false, rule: UI-only 命名空间——仅供界面/诊断，convertToLlm 白名单投影时永不输出 }
  ref_invalid: { type: array, required: false, rule: digest 校验失败标记（见下）；存在即表示该事件引用未通过校验 }

# ---------------------------------------------------------------------
# domain_refs digest 校验（任务书 S2-2 + owner 口径 #1/#2）
# ---------------------------------------------------------------------
digest_check:
  resolver:                  # "引用前向 ATF 查询该 fact 的当前 digest" 本阶段的承载方式
    kind: injected           # DigestResolver 注入式接口（harness 侧定义）
    reason: 真实对端 = 内核 fact digest 查询能力，尚未落地——按 owner 决议 ②1 同口径在 ATF 仓排队，
            不阻塞、不插队；S2 提供契约 mock 实现（可配置返回指定 digest / 缺失），内核落地 re-pin 后接入
  semantics:
    found + digest 一致      → 校验通过（事件不带任何校验标记）
    found + digest 不一致    → 该事件标记 ref_invalid + 触发 block（fail-closed）
    not_found               → 该事件标记 ref_invalid + 触发 block（fail-closed）
    resolver 查询自身失败    → err(resolver_failure)：不落盘、不标记、不猜测（基础设施故障 ≠ 引用无效）
  check_points:
    append: 写入前实时校验；失败事件仍落盘（ref_invalid 标记 = 事实留痕），但返回结构化 block
    replay: 逐事件重新校验（落盘文件可能被篡改）；被篡改事件内存中标记 ref_invalid 并报告 block，
            文件本身只读不改写（会话流是事实记录）
  block:                     # owner 口径 #2：本阶段 block = 返回结构化 block 结果（审批 UI 属后续 slice）
    reason: ref_invalid
    fields: { event_id, invalid_refs: [{ index, journal_type, fact_id, claimed_digest, cause }] }
    cause 枚举: [digest_mismatch, fact_not_found]

# ---------------------------------------------------------------------
# 落盘形态（owner 口径 #4：append-only JSONL，与会话事件流同构）
# ---------------------------------------------------------------------
persistence:
  format: JSONL              # 每行恰好一个完整事件 JSON，UTF-8，行尾 LF；中间空行 = 损坏流
  mode: append-only          # 只追加、不改写不删除；崩溃可重建（replay）
  durability:                # P2-S1 定死；S1a 按决议 §2.2 修正措辞（两档强度不同）
    contract: durability 契约按档表述「已确认事件」，两档强度不同：
              逐条档 ack = 已 fsync——已确认事件具备断电级持久性（永不丢）；
              批量档 ack = write 完成已入 OS（进程崩溃不丢）——ack 不含断电级持久性，
              断电级确认点 = 刷盘水位线（unsyncedEvents 归零）
    default: per-append      # 默认恒为逐条 fsync（决议 §2.2 三条件之一：批量档不得为默认档）
    batch:                   # 批量窗口性能档（收在常量层，模型不可见；仅显式选择时启用）
      flush_when: 攒满 N 条立即 fsync，否则自首条未刷事件起 T 毫秒窗口到期 fsync（二者先到）
      constants: { batch_max_events: 32, batch_window_ms: 50 }
      ack_semantics: ack = write 完成已入 OS（顺序保留，进程崩溃不丢）；断电级持久性
                     以刷盘水位线为准（unsyncedEvents 归零）——适用于可容忍丢尾部的场景
    consumer_discipline:     # 决议 §2.2 三条件之三：消费者纪律
      需要证据级持久性的消费者（P2-S2 的 suspended/resume 状态推进、未来 TEM 回灌）
      必须使用 per-append 档，或在推进状态前显式调用 flush() 并确认成功
    audit_note: 批量档下 session/compaction 审计事件同样仅到 write 级——压缩摘要可由
                算法从事件流确定性重建，审计事件不承担唯一副本职责
    crash_recovery: 两档均有「写入中途 kill 进程 → replay 校验确认点内事件无缺失」用例；
                    S1a 起另含 kill 后注入半行尾的修复路径用例（见 tail_repair 节）
  path: 由调用方注入（库不内置路径策略）；S4 工作区落地后默认约定 runs/<run_id>/session.jsonl
  write_order: id 必须与落盘顺序一致且严格连续（续写打开时从文件尾部 id 续接）

# ---------------------------------------------------------------------
# compaction（P2-S1，任务书 §2 设计要求 1–5 / ADR-09 C4；常量层，模型不可见）
# ---------------------------------------------------------------------
compaction:
  invariants:
    - append-only 不变：压缩只影响投给模型的投影视图（transformContext），磁盘事件流不删不改
    - 计划为纯函数：live 与 replay 对同一事件序列计算结果逐条一致（重建一致、幂等重放）
    - 承证白名单：携带 domain_refs 的事件及其相邻因果链永不折叠，引用链留在模型上下文
  trigger:                    # 双指标，先到者生效（owner 口径 #2；初值选取理由如下）
    event_count: 128          # 实质事件数门：Phase 1 冒烟单分支 ≤ 50 事件，128 留 2 倍以上
                              # 余量——小会话零压缩开销，长会话在可控粒度折叠
    token_budget: 24000       # 估算 token 门（兜底「事件少但单条超长」形态）；
                              # 估算 = ceil(payload JSON 字符串长度 / 2) 求和——中文约 0.6–1
                              # token/字符，取 1/2 为偏保守估计（宁可早压，不冒溢出险）
    note: 实质事件 = 除 session/compaction 审计事件外的全部事件（审计对算法透明）
  algorithm:
    keep_recent: 32           # 保留窗：最近 32 条实质事件永不折叠（模型保有最新原文上下文）
    chunk: 32                 # 折叠边界按 32 的整数倍推进（滞后防逐条重折叠）
    whitelist: domain_refs 命中事件 + 其配对事件（tool/result ↔ 往前最近同名工具 tool/call，
                tool/call ↔ 往后最近同名工具 tool/result）永不折叠，原文保留于投影
    projection_form: [压缩摘要(session/compaction), 折叠区间白名单豁免原文…, 保留窗原文…]
  audit_event:
    type: session/compaction
    written_by: SessionLog.append 自动落盘（同一折叠边界按 covers.to_id 判重只记一次）
    payload_fields: [kind, covers{from_id,to_id}, folded_count, kept_ids, type_counts,
                     trigger{events,estimated_tokens,reason}, text]
    purpose: 可审计（哪次压缩吃掉了哪些事件）+ 计划重建锚；审计事件不进入模型投影
    note: 审计事件（含 session/repair）对压缩算法透明；批量档下审计事件仅到 write 级，
          摘要可由算法确定性重建（见 durability.audit_note）

# ---------------------------------------------------------------------
# 尾部残段修复（S1a，决议 §2.1：容忍 + 截断留痕）
# ---------------------------------------------------------------------
tail_repair:
  judgement: 文件非空且不以 LF 结尾 → 末段为「未确认尾部」（write 未完成的残段，从未被
             ack）；无论残段内容是否可解析，一律判为残段
  scope: 容忍仅限文件末尾；中间行不可解析 / id 断裂仍 fail-closed corrupt_stream（原语义不变）
  action:
    replay: 只读——内存中丢弃残段，以 truncated_tail 报告，文件不动
    create: 先物理截断该残段（UTF-8 字节精确，不触及任何已确认事件）再续写
  paired_audit:
    type: session/repair
    rule: 截断与留痕必须成对；留痕写失败 = 修复失败上报（fail-closed）
    payload_fields: [dropped_bytes, dropped_from_offset, tail_excerpt(前64字符), tail_sha256]
  return_shape:
    replay: ReplayOutcome.truncated_tail = { dropped_bytes, dropped_from_offset } | null
    create: SessionLog 实例属性 truncatedTail 同构（包装层透传属 S2 run 层）
  transparency: session/repair 对压缩算法透明（同 session/compaction：不计触发指标、
                不参与折叠、不进入投影）
  boundary: 已知边界，非待办承诺（S1b 登记，决议 §1.2/§2.3）：会话流无防篡改链
            （hash chain），「整条尾部完整事件被连同 LF 删除」在结构上不可检测——
            文件以更早的 LF 结尾、不构成残段；本节留痕（tail_excerpt/tail_sha256）
            仅对「残段」类截断具备取证能力。发现整条删除需外部锚（run journal 事实 /
            catalog sha）；Phase 2 不实现会话流 hash chain。

# ---------------------------------------------------------------------
# schema v0 → v1 迁移说明（任务书 §2 设计要求 2：旧会话可 replay）
# ---------------------------------------------------------------------
migration:
  v0_to_v1:
    compatibility: 向后兼容——v0 落盘流的全部事件类型与字段在 v1 规则下原样合法
    action: 无需迁移/改写；v1 代码直接 replay v0 会话（新增类型在 v0 流中不出现）
    validation: v1 校验器对 v0 流逐行通过；启用位检查对 v0 七类全部放行
    version_carrier: 落盘流无版本头（逐行自描述）；版本语义由读取方（本契约）承载

# ---------------------------------------------------------------------
# headless run 退出码（S1b 挪移，决议 §2.3）：exit code 属进程/运行面语义，
# 全表登记于 bridge.contract.yaml 头部「exit 78 语义登记」+「exit 75/79 枚举补登」
# （2026-09-11）区块；此处仅保留指向性引用，不并存同义内容。
# ---------------------------------------------------------------------
headless_exit_codes: 见 bridge.contract.yaml 头部登记（0/78/1 既有语义 + 75 suspended / 79 aborted 枚举补登）

# ---------------------------------------------------------------------
# 双管道（任务书 S2-3 定签名；P2-S1 起真实实现，登记于 pipeline 节）
# ---------------------------------------------------------------------
pipeline:
  transformContext:
    signature: (events: readonly SessionEvent[]) => LlmContextEvent[]
    behavior_v1: 过滤 assistant/attempt + compaction 投影（未触发 = v0 语义原样；
                 触发 = [压缩摘要] + [白名单豁免原文] + [保留窗原文]，审计事件不进入投影）
  convertToLlm:
    signature: (event: SessionEvent) => LlmContextEvent
    behavior_v1: 白名单投影——输出仅 { id, ts, type, payload, domain_refs?, synthetic? }；
                 ui / projection / ref_invalid 及未来任何新增字段一律不出现（内部字段不发模型）
  llm_context_event_fields: [id, ts, type, payload, domain_refs?, synthetic?]
  synthetic_semantics: 投影合成的压缩摘要条目携带 synthetic: true（P1-2 修复，S1a）；
                       与同 id 的白名单豁免原文区分，投影消费者按 (id, synthetic) 唯一识别；
                       原文条目不携带该键（ADR-09 §1.2 投影形态纪律）
